<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VyGi</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="brand"><span id="brand-logo"></span><span class="brand-name">VyGi</span></div>
        <div id="router-card">
          <span id="conn-dot" class="dot"></span>
          <div class="router-text">
            <div id="conn-label">Not connected</div>
            <div id="conn-sub" class="hint"></div>
          </div>
          <button id="btn-new-window" class="icon-btn" title="New window: manage another router at the same time"></button>
        </div>
        <button id="btn-connect" class="tb-btn">Connect</button>
        <nav id="view-switch" class="nav">
          <button data-view="dashboard">Dashboard</button>
          <button data-view="clients">Clients</button>
          <button data-view="networks">Networks</button>
          <button data-view="rules">Traffic Rules</button>
          <button data-view="ports">Port Forwarding</button>
          <button data-view="vpn">VPN</button>
          <button data-view="history">History</button>
          <button data-view="windows">Advanced</button>
        </nav>
        <div class="nav-label" id="menu-label">Advanced tools</div>
        <nav id="menu"></nav>
        <div id="sidebar-foot">
          <div id="web-account" hidden><a id="web-password" href="#">Web password</a> · <a id="web-logout" href="#">Log out</a></div>
          <label class="switch autosave" title="Write changes to the boot config as soon as they're applied (after Confirm in Safe Mode), so they survive a restart"><input type="checkbox" id="auto-save" /><span class="switch-ui"></span> Save changes automatically</label>
          <select id="theme" title="Look">
            <option value="modern-auto">Modern (follow system)</option>
            <option value="modern-light">Modern light</option>
            <option value="modern-dark">Modern dark</option>
            <option value="classic">Classic (Winbox)</option>
          </select>
        </div>
      </aside>
      <div id="main-col">
        <header id="toolbar">
          <h1 id="page-title">Dashboard</h1>
          <span class="tb-spacer"></span>
          <span class="search-wrap"><input id="search" type="search" placeholder="Search (Ctrl+K)" autocomplete="off" spellcheck="false" /></span>
          <span class="safe-group" title="Safe Mode: changes revert by themselves unless you press Confirm (VyOS commit-confirm)">
            <label class="switch tb-check"><input type="checkbox" id="safe-mode" checked /><span class="switch-ui"></span> Safe Mode</label>
            <select id="safe-minutes" title="Minutes before an unconfirmed change is reverted">
              <option value="1">1 min</option>
              <option value="2" selected>2 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
            </select>
          </span>
          <button id="btn-alerts" class="icon-btn" title="Alerts" disabled></button>
          <button id="btn-confirm" class="tb-btn badge-warn" hidden>Confirm</button>
          <button id="btn-save" class="tb-btn" disabled title="Write running config to the boot config">Save</button>
          <button id="btn-terminal" class="tb-btn" disabled title="Open an SSH terminal">Terminal</button>
        </header>
        <div id="body">
          <section id="dashboard" class="view" hidden></section>
          <section id="clients" class="view" hidden></section>
          <section id="networks" class="view" hidden></section>
          <section id="rules" class="view" hidden></section>
          <section id="ports" class="view" hidden></section>
          <section id="vpnpage" class="view" hidden></section>
          <section id="history" class="view" hidden></section>
          <main id="workspace" class="view"></main>
        </div>
        <footer id="statusbar"><span id="status-text">Ready</span></footer>
      </div>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
